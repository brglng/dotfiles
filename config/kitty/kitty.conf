cursor_shape beam
cursor_blink_interval 0
# cursor_trail 1

# Send modified keys with ambiguous legacy encodings as CSI u sequences.
# Kitty's own kitty_mod shortcuts remain untouched.
# Shift+Space, unlike other shifted ASCII keys, has no legacy encoding.
map shift+space send_text all \x1b[32;2u
map shift+alt+space send_text all \x1b[32;4u
map ctrl+shift+space send_text all \x1b[32;6u
map ctrl+shift+alt+space send_text all \x1b[32;8u
map ctrl+shift+d send_text all \x1b[100;6u
map ctrl+shift+i send_text all \x1b[105;6u
map ctrl+shift+m send_text all \x1b[109;6u
map ctrl+shift+y send_text all \x1b[121;6u
map ctrl+shift+backslash send_text all \x1b[92;6u
map ctrl+shift+semicolon send_text all \x1b[59;6u
map ctrl+shift+apostrophe send_text all \x1b[39;6u
map shift+enter send_text all \x1b[13;2u
map ctrl+enter send_text all \x1b[13;5u
map ctrl+shift+enter send_text all \x1b[13;6u
map alt+enter send_text all \x1b[13;3u
map ctrl+alt+enter send_text all \x1b[13;7u
map shift+alt+enter send_text all \x1b[13;4u
map ctrl+shift+alt+enter send_text all \x1b[13;8u

# Modified non-ASCII text keys need application-side keyboard protocol support.
# Kitty cannot make terminal programs parse keys they do not understand.

scrollbar hovered
scrollbar_width 1.0

url_style straight

window_border_width 0pt
placement_strategy top
hide_window_decorations titlebar-only

tab_bar_style powerline
tab_powerline_style round
active_tab_font_style bold

notify_on_cmd_finish unfocused

macos_option_as_alt yes
macos_show_window_title_in window
macos_quit_when_last_window_closed yes
wheel_scroll_multiplier 1.0
